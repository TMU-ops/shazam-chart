name: Fetch Shazam IL chart

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch.yml']
  schedule:
    # GitHub delays scheduled runs by hours on low-activity repos (observed ~6-7h),
    # so run twice daily for better odds of a fresh same-day chart.
    - cron: '0 2 * * *'
    - cron: '30 5 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-chart
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch chart CSV
        id: fetch
        run: |
          set -uo pipefail
          URL="https://www.shazam.com/services/charts/csv/top-200/israel/"

          # Shazam's CDN serves a poisoned 1.79MB HTML page as the *uncompressed*
          # variant of every URL on the site (broken since 2026-09-02). The gzip
          # variant still holds the real CSV, so --compressed is load-bearing.
          # Also load-bearing: the trailing slash and no query string.
          # UA matters and differs by egress: from GitHub runners a bare curl UA
          # gets a hard 403, while the short Mozilla UA historically got through;
          # a FULL Chrome UA trips bot mitigation and returns 405. So cycle a few
          # shapes per attempt and log which one wins.
          ua_for() {
            case $(( $1 % 3 )) in
              0) printf '%s' "-A|Mozilla/5.0 (Windows NT 10.0; Win64; x64)" ;;
              1) printf '%s' "-A|Mozilla/5.0 (Windows NT 10.0; Win64; x64)|-H|Accept: text/csv,*/*" ;;
              2) printf '%s' "" ;;
            esac
          }

          # Canonical byte layout: BOM, newline, date line, header, 200 rows.
          normalize() {
            hdr=$(grep -an '^Rank,Artist,Title' "$1" 2>/dev/null | head -1 | cut -d: -f1)
            [ -n "$hdr" ] && [ "$hdr" -ge 2 ] || return 1
            start=$((hdr - 1))
            { printf '\357\273\277\n'; tail -n +"$start" "$1"; } > "$2"
            [ -n "$(tail -c1 "$2")" ] || truncate -s -1 "$2"
            return 0
          }

          # Echoes a reason string. Exit 0 only for a real, complete, dated chart.
          validate() {
            f="$1"
            [ -s "$f" ] || { echo "empty"; return 1; }
            sz=$(stat -c%s "$f")
            [ "$sz" -lt 60000 ] || { echo "too_big(${sz}B)"; return 1; }
            if head -c 512 "$f" | grep -qi '<html\|<!doctype'; then
              echo "html_page(${sz}B)"; return 1; fi
            grep -q '^Rank,Artist,Title$' "$f" || { echo "no_header(${sz}B)"; return 1; }
            rows=$(grep -cE '^[0-9]+,' "$f")
            [ "$rows" -eq 200 ] || { echo "rows=${rows}_expected_200"; return 1; }
            grep -q '^1,' "$f" && grep -q '^200,' "$f" || { echo "rank_range_bad"; return 1; }
            d=$(sed -n '1,3p' "$f" | grep -oE '[0-9]{1,2} [A-Z][a-z]+ 20[0-9]{2}' | head -1)
            [ -n "$d" ] || { echo "no_date_line"; return 1; }
            echo "ok(rows=${rows},date=${d},${sz}B)"
            return 0
          }

          WINNER=""; WHY=""; LOG=""; why=""; TALLY=""

          # ---- SOURCE 1: Shazam direct, compressed ----
          for i in $(seq 1 15); do
            IFS='|' read -r -a UA <<< "$(ua_for "$i")" || true
            code=$(curl -s --compressed -m 45 -D hdr.txt -o raw.bin -w '%{http_code}' "${UA[@]}" "$URL"); cx=$?
            srv=$(grep -i '^x-served-by:' hdr.txt | tr -d '\r' | cut -d' ' -f2- | head -1)
            bytes=$(stat -c%s raw.bin 2>/dev/null || echo 0)
            if   [ "$cx" -ne 0 ];      then why="curl_exit_${cx}"
            elif [ "$code" != "200" ]; then why="http_${code}"
            elif ! normalize raw.bin cand.csv; then why="unparseable(${bytes}B)"
            else why=$(validate cand.csv); fi
            echo "shazam attempt ${i}: ua=$(( i % 3 )) http=${code} bytes=${bytes} via=${srv} -> ${why}"
            TALLY="${TALLY}$(( i % 3 )):${code}/${why%%(*} "
            case "$why" in
              ok*) WINNER="shazam_direct"; WHY="$why"; break ;;
            esac
            sleep 6
          done
          if [ -n "$WINNER" ]; then LOG="shazam_direct:${WHY} ua=$(( i % 3 )); "
          else LOG="shazam_direct FAILED [ua:code/why] ${TALLY}; "; fi

          # ---- SOURCE 2: same Shazam file over a different network path ----
          if [ -z "$WINNER" ]; then
            for i in 1 2 3; do
              code=$(curl -s -m 60 -o raw.bin -w '%{http_code}'                        -H 'Accept: text/plain' -H 'X-Return-Format: text'                        "https://r.jina.ai/${URL}"); cx=$?
              bytes=$(stat -c%s raw.bin 2>/dev/null || echo 0)
              if   [ "$cx" -ne 0 ];      then why="curl_exit_${cx}"
              elif [ "$code" != "200" ]; then why="http_${code}"
              elif ! normalize raw.bin cand.csv; then why="unparseable(${bytes}B)"
              else why=$(validate cand.csv); fi
              echo "jina attempt ${i}: http=${code} bytes=${bytes} -> ${why}"
              case "$why" in
                ok*) WINNER="shazam_via_jina"; WHY="$why"; break ;;
              esac
              sleep 10
            done
            LOG="${LOG}shazam_via_jina:${WHY:-$why}; "
          fi

          # ---- SOURCE 3: last-resort public proxies ----
          # Individually unreliable (tested 06.09.26: allorigins 500, codetabs 522,
          # cors.lol rate-limited) and reached only after jina has already failed.
          # They cost nothing to try and validate() rejects whatever they get wrong,
          # so a flaky source can only add availability, never corrupt latest.csv.
          if [ -z "$WINNER" ]; then
            PROXIES="https://api.allorigins.win/raw?url=${URL}"
            PROXIES="${PROXIES} https://api.codetabs.com/v1/proxy?quest=${URL}"
            PROXIES="${PROXIES} https://api.cors.lol/?url=${URL}"
            for prox in $PROXIES; do
              host=$(printf '%s' "$prox" | sed 's|https://||; s|/.*||')
              code=$(curl -s -m 45 -o raw.bin -w '%{http_code}' "$prox"); cx=$?
              bytes=$(stat -c%s raw.bin 2>/dev/null || echo 0)
              if   [ "$cx" -ne 0 ];      then why="curl_exit_${cx}"
              elif [ "$code" != "200" ]; then why="http_${code}"
              elif ! normalize raw.bin cand.csv; then why="unparseable(${bytes}B)"
              else why=$(validate cand.csv); fi
              echo "proxy ${host}: http=${code} bytes=${bytes} -> ${why}"
              LOG="${LOG}${host}:${why}; "
              case "$why" in
                ok*) WINNER="proxy_${host}"; WHY="$why"; break ;;
              esac
              sleep 5
            done
          fi

          # ---- PROBE (diagnostic only, never promoted) ----
          # The CSV endpoint started returning the site's HTML app shell on
          # 05.09.26 while the chart PAGE still renders fine from a home
          # connection. Parsing that page is the obvious plan B, but only if a
          # GitHub runner can load it at all. Record that, decide later.
          PGURL="https://www.shazam.com/charts/top-200/israel"
          PAGE=$(curl -s -m 30 --compressed -o page.tmp -w '%{http_code}' -A "$UAS" "$PGURL")
          PAGEB=$(stat -c%s page.tmp 2>/dev/null || echo 0)
          if grep -q 'Album artwork for album titled' page.tmp 2>/dev/null; then
            PAGEOK=true; else PAGEOK=false; fi
          echo "page probe: http=${PAGE} bytes=${PAGEB} has_chart_markup=${PAGEOK}"
          rm -f page.tmp

          # ---- Promote only a validated candidate; latest.csv is untouchable otherwise ----
          OK=false
          if [ -n "$WINNER" ]; then OK=true; mv cand.csv latest.csv; fi
          rm -f cand.csv raw.bin hdr.txt

          # ---- Age is measured on the file the consumer actually reads ----
          CD=$(sed -n '1,3p' latest.csv | grep -oE '[0-9]{1,2} [A-Z][a-z]+ 20[0-9]{2}' | head -1)
          ISO=$(date -u -d "$CD" +%F 2>/dev/null || echo unknown)
          if [ "$ISO" = "unknown" ]; then AGE=999
          else AGE=$(( ( $(date -u +%s) - $(date -u -d "$ISO" +%s) ) / 86400 )); fi
          if [ "$AGE" -ge 2 ]; then STALE=true; else STALE=false; fi

          cat > status.json <<JSON
          {
            "checked_at": "$(date -u +%FT%TZ)",
            "fetch_ok": ${OK},
            "source_used": "${WINNER:-none}",
            "is_shazam": ${OK},
            "chart_date": "${ISO}",
            "age_days": ${AGE},
            "stale": ${STALE},
            "attempts": "$(printf '%s' "$LOG" | sed 's/"/\\"/g')",
            "page_probe": "http_${PAGE},${PAGEB}B,chart_markup=${PAGEOK}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON

          {
            echo "## Shazam IL chart fetch"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| fetch_ok | \`${OK}\` |"
            echo "| source | \`${WINNER:-none}\` |"
            echo "| chart date in latest.csv | \`${ISO}\` (age ${AGE}d) |"
            echo "| attempts | \`${LOG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ok=${OK}"                >> "$GITHUB_OUTPUT"
          echo "source=${WINNER:-none}"  >> "$GITHUB_OUTPUT"
          echo "age=${AGE}"              >> "$GITHUB_OUTPUT"

          if [ "$OK" != "true" ]; then
            echo "::error title=Chart fetch FAILED - latest.csv left at ${ISO} (${AGE}d old)::${LOG}"
            exit 1
          fi
          if [ "$AGE" -ge 3 ]; then
            echo "::error title=Chart fetched OK but is ${AGE} days old (${ISO})::upstream may be frozen"
            exit 1
          fi
          echo "::notice title=Chart OK via ${WINNER}::${WHY}"

      - name: Archive snapshot + rebuild peaks
        if: always()
        run: |
          set -uo pipefail
          # Read the chart date from the file being archived instead of passing
          # it between steps. The first version took it from a step output that
          # was never actually written, so ISO was empty, the guard rejected it,
          # and the archive silently did nothing for every run.
          CD=$(sed -n '1,3p' latest.csv | grep -oE '[0-9]{1,2} [A-Z][a-z]+ 20[0-9]{2}' | head -1)
          ISO=$(date -u -d "$CD" +%F 2>/dev/null || echo unknown)

          # File by CHART date, never run date: a chart that arrives a day late
          # must not be archived as today's. A failed fetch archives nothing --
          # latest.csv still holds an older chart and would forge a snapshot.
          if [ "${{ steps.fetch.outputs.ok }}" = "true" ]; then
            case "$ISO" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                mkdir -p history
                cp latest.csv "history/${ISO}.csv"
                echo "archived history/${ISO}.csv"
                ;;
              *)
                echo "::error title=Unparseable chart date::date line was: ${CD:-<none>}"
                exit 1
                ;;
            esac
            # A successful fetch that leaves no snapshot behind is the failure
            # mode that just cost a day of data. Never let it pass quietly.
            if [ ! -f "history/${ISO}.csv" ]; then
              echo "::error title=Archive missing::history/${ISO}.csv was not written"
              exit 1
            fi
          else
            echo "fetch failed - no new snapshot to archive"
          fi

          # peaks.csv is rebuilt from scratch every run, so there is no state to
          # drift and a bad day heals itself on the next good one.
          RC=0
          python3 scripts/build_peaks.py | tee build.log || RC=1
          {
            echo ""
            echo "### Weekly peaks"
            echo ""
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f build.log

          if [ "$RC" != "0" ]; then
            echo "::error title=peaks rebuild failed::peaks.csv may be stale"
            exit 1
          fi

      - name: Commit CSV + status
        if: always()
        run: |
          git config user.name  "chart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          if [ "${{ steps.fetch.outputs.ok }}" = "true" ]; then
            git commit -m "chart update $(date -u +%F) [${{ steps.fetch.outputs.source }}]"
          else
            git commit -m "FETCH FAILED $(date -u +%F) - latest.csv unchanged (${{ steps.fetch.outputs.age }}d old)"
          fi
          git pull --rebase --autostash || true
          git push
