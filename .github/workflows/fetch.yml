name: Fetch Shazam IL chart

on:
  push:
  workflow_dispatch:
  schedule:
    # GitHub delays scheduled runs by hours on low-activity repos (observed ~6-7h),
    # so run twice daily for better odds of a fresh same-day chart.
    - cron: '0 2 * * *'    # 02:00 UTC — delayed run typically lands mid-morning
    - cron: '30 5 * * *'   # 05:30 UTC — second chance

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch chart CSV
        run: |
          curl -sSL --retry 3 --retry-delay 10 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o latest.csv \
            "https://www.shazam.com/services/charts/csv/top-200/israel/"
          # sanity check: refuse to commit an error page
          grep -q "Rank,Artist,Title" latest.csv

      - name: Commit if changed
        run: |
          git config user.name "chart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.csv
          git diff --cached --quiet || git commit -m "chart update $(date -u +%F)"
          git push
